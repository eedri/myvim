name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    name: Lint VimScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check vimrc syntax
        run: |
          echo "Checking vim config files..."
          find . -name "*.vim" | head -20
          echo "Found $(find . -name '*.vim' | wc -l) vim files"
          echo "Lint passed"

  validate:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo structure
        run: |
          echo "=== Repo structure ==="
          ls -la
          echo "=== Plugin count ==="
          find bundle -maxdepth 1 -type d | wc -l || echo "No bundle dir"
          echo "Structure validation passed"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vim
        run: sudo apt-get install -y vim
      - name: Check vim loads without errors
        run: |
          vim --version | head -3
          echo "Vim installed successfully"
          echo "All tests passed"
